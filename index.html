<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #202123;
      color: white;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }

    input, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #40414F;
      color: white;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #19c37d;
      color: white;
    }

    .logout {
      background: red;
      padding: 8px;
      border: none;
      border-radius: 8px;
      margin: 5px;
      cursor: pointer;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #2b2c33;
    }

    #contacts {
      background: #2b2c33;
      padding: 10px;
      font-size: 12px;
    }

    .contact {
      padding: 5px;
      border-bottom: 1px solid #444;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      padding: 8px;
      border-radius: 10px;
      max-width: 70%;
      font-size: 14px;
    }

    .me {
      background: #19c37d;
      align-self: flex-end;
    }

    .other {
      background: #2E2F3A;
      align-self: flex-start;
    }

    .meta {
      font-size: 10px;
      opacity: 0.7;
    }

    .actions {
      font-size: 10px;
      margin-top: 4px;
      cursor: pointer;
    }

    .input-area {
      display: flex;
      gap: 5px;
      padding: 10px;
      background: #2b2c33;
    }

    img {
      max-width: 200px;
      border-radius: 10px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button class="btn" onclick="loginGoogle()">Google</button>

  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">

  <button class="btn" onclick="loginEmail()">Entrar</button>
</div>

<!-- CHAT -->
<div id="chatUI" style="display:none;" class="container">

  <div class="topbar">
    <button class="logout" onclick="logout()">Salir</button>

    <select id="room" onchange="cambiarSala()">
      <option value="general">General</option>
      <option value="gaming">Gaming</option>
      <option value="random">Random</option>
    </select>
  </div>

  <div id="contacts"></div>

  <div id="messages" class="messages"></div>

  <div class="input-area">
    <input id="mensaje" placeholder="Mensaje">
    <input type="file" id="file">
    <button class="btn" onclick="enviar()">Enviar</button>
    <button class="btn" onclick="enviarArchivo()">📎</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  updateDoc,
  onSnapshot,
  query,
  orderBy,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged,
  signOut,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const app = initializeApp({
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH",
  projectId: "TU_PROJECT",
  storageBucket: "TU_BUCKET"
});

const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let room = "general";
let editId = null;

const msgInput = document.getElementById("mensaje");

// 🔔 NOTIFICACIONES
if ("Notification" in window) {
  Notification.requestPermission();
}

// LOGIN GOOGLE
window.loginGoogle = () => signInWithPopup(auth, provider);

// LOGIN EMAIL
window.loginEmail = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch {
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

window.logout = () => signOut(auth);

// SALAS
window.cambiarSala = () => {
  room = document.getElementById("room").value;
  listenMessages();
};

// USUARIO LOGUEADO
onAuthStateChanged(auth, async (user) => {
  document.getElementById("login").style.display = user ? "none" : "flex";
  document.getElementById("chatUI").style.display = user ? "flex" : "none";

  if (!user) return;

  // guardar usuario (contactos)
  await setDoc(doc(db, "users", user.uid), {
    uid: user.uid,
    email: user.email,
    lastSeen: Date.now()
  });

  loadContacts();
  listenMessages();
});

// ENVIAR MENSAJE
window.enviar = async () => {
  const user = auth.currentUser;
  if (!user || !msgInput.value) return;

  await addDoc(collection(db, "mensajes"), {
    mensaje: msgInput.value,
    usuario: user.email,
    uid: user.uid,
    room,
    fecha: Date.now()
  });

  msgInput.value = "";
};

// SUBIR ARCHIVO
window.enviarArchivo = async () => {
  const file = document.getElementById("file").files[0];
  const user = auth.currentUser;
  if (!file || !user) return;

  const fileRef = ref(storage, "chat/" + Date.now() + file.name);

  await uploadBytes(fileRef, file);
  const url = await getDownloadURL(fileRef);

  await addDoc(collection(db, "mensajes"), {
    usuario: user.email,
    uid: user.uid,
    image: url,
    room,
    fecha: Date.now()
  });
};

// BORRAR / EDITAR
window.borrar = async (id) => {
  await deleteDoc(doc(db, "mensajes", id));
};

window.editar = (id, texto) => {
  msgInput.value = texto;
  editId = id;
};

// CONTACTOS
function loadContacts() {
  onSnapshot(collection(db, "users"), (snap) => {
    const div = document.getElementById("contacts");
    div.innerHTML = "<b>Contactos</b>";

    snap.forEach(u => {
      div.innerHTML += `
        <div class="contact">🟢 ${u.data().email}</div>
      `;
    });
  });
}

// MENSAJES
function listenMessages() {
  const q = query(collection(db, "mensajes"), orderBy("fecha", "asc"));

  onSnapshot(q, (snap) => {
    const div = document.getElementById("messages");
    div.innerHTML = "";

    snap.forEach(d => {
      const m = d.data();
      if (m.room !== room) return;

      const isMe = auth.currentUser?.uid === m.uid;

      const msg = document.createElement("div");
      msg.className = "msg " + (isMe ? "me" : "other");

      msg.innerHTML = `
        <b>${m.usuario}</b><br>
        ${m.mensaje || ""}
        ${m.image ? `<br><img src="${m.image}">` : ""}

        <div class="meta">${new Date(m.fecha).toLocaleTimeString()}</div>

        ${isMe ? `
        <div class="actions">
          <span onclick="editar('${d.id}','${m.mensaje || ""}')">✏️</span>
          <span onclick="borrar('${d.id}')">🗑️</span>
        </div>` : ""}
      `;

      div.appendChild(msg);

      // 🔔 NOTIFICACIÓN
      if (document.hidden && m.uid !== auth.currentUser?.uid) {
        new Notification("Nuevo mensaje", {
          body: m.usuario + ": " + (m.mensaje || "📎 Archivo")
        });
      }
    });

    div.scrollTop = div.scrollHeight;
  });
}

// ENTER
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") enviar();
});
</script>

</body>
</html>
