<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* CONTACTOS */
    .contacts {
      width: 35%;
      background: #1f2c34;
      overflow-y: auto;
    }

    .contact {
      padding: 12px;
      color: white;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    .contact:hover {
      background: #2a3942;
    }

    /* CHAT */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b141a;
    }

    .header {
      background: #202c33;
      color: white;
      padding: 10px;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
      max-width: 70%;
    }

    .yo {
      background: #005c4b;
      color: white;
      margin-left: auto;
    }

    .otro {
      background: #202c33;
      color: white;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #202c33;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: #2a3942;
      color: white;
    }

    .input-area button {
      margin-left: 5px;
      padding: 10px 15px;
      background: #00a884;
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
    }

    .login-box {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button onclick="loginGoogle()">Google</button>
  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="loginEmail()">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none;">

  <div class="contacts" id="contactos"></div>

  <div class="chat-container">
    <div class="header" id="chatNombre">Selecciona un contacto</div>

    <div id="chat" class="messages"></div>

    <div class="input-area">
      <input id="mensaje" placeholder="Mensaje">
      <button onclick="enviar()">➤</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, getDocs, doc, setDoc, query } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { 
  getAuth, 
  signInWithPopup, 
  GoogleAuthProvider, 
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJxRJfJ2fWZPKaBeOVS7BFOWeDM_WH6MU",
  authDomain: "nexchat-382ba.firebaseapp.com",
  projectId: "nexchat-382ba",
  storageBucket: "nexchat-382ba.firebasestorage.app",
  messagingSenderId: "217334097339",
  appId: "1:217334097339:web:87f002c08a522c9abd509e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const mensajesRef = collection(db, "mensajes");
const usersRef = collection(db, "users");

let usuarioSeleccionado = null;
let ultimoMensaje = null;

// 🔔 PERMISO
Notification.requestPermission();

// LOGIN GOOGLE
window.loginGoogle = async () => {
  await signInWithPopup(auth, provider);
};

// LOGIN EMAIL
window.loginEmail = async () => {
  const email = emailInput.value;
  const pass = password.value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch {
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

// ESTADO
onAuthStateChanged(auth, async (user) => {
  if (user) {
    login.style.display = "none";
    app.style.display = "flex";

    await setDoc(doc(db, "users", user.uid), {
      nombre: user.displayName || user.email
    });

    cargarUsuarios();
  } else {
    login.style.display = "block";
    app.style.display = "none";
  }
});

// CONTACTOS
async function cargarUsuarios() {
  const snapshot = await getDocs(usersRef);
  contactos.innerHTML = "";

  snapshot.forEach((docu) => {
    if (docu.id === auth.currentUser.uid) return;

    const div = document.createElement("div");
    div.className = "contact";
    div.textContent = docu.data().nombre;

    div.onclick = () => {
      usuarioSeleccionado = docu.id;
      chatNombre.textContent = docu.data().nombre;
      chat.innerHTML = "";
    };

    contactos.appendChild(div);
  });
}

// ENVIAR
window.enviar = async () => {
  if (!mensaje.value || !usuarioSeleccionado) return;

  await addDoc(mensajesRef, {
    de: auth.currentUser.uid,
    para: usuarioSeleccionado,
    mensaje: mensaje.value,
    fecha: Date.now()
  });

  mensaje.value = "";
};

// MENSAJES + NOTIFICACIONES
onSnapshot(query(mensajesRef), (snapshot) => {
  snapshot.docChanges().forEach((change) => {
    if (change.type === "added") {
      const data = change.doc.data();
      const yo = auth.currentUser.uid;

      if (
        (data.de === yo && data.para === usuarioSeleccionado) ||
        (data.de === usuarioSeleccionado && data.para === yo)
      ) {
        const div = document.createElement("div");
        div.classList.add("msg");
        div.classList.add(data.de === yo ? "yo" : "otro");
        div.textContent = data.mensaje;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      // 🔔 NOTIFICACIÓN
      if (data.de !== yo && Notification.permission === "granted") {
        if (ultimoMensaje !== data.mensaje) {
          new Notification("Nuevo mensaje 💬", {
            body: data.mensaje
          });
          ultimoMensaje = data.mensaje;
        }
      }
    }
  });
});
</script>

</body>
</html>
