<!DOCTYPE html>
<html>
<head>
  <title>NexChat WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111b21;
      color: white;
      display: flex;
    }

    /* SIDEBAR CHATS */
    .sidebar {
      width: 30%;
      background: #202c33;
      height: 100vh;
      overflow-y: auto;
    }

    .chat-item {
      padding: 12px;
      border-bottom: 1px solid #2a3942;
      cursor: pointer;
    }

    .chat-item:hover {
      background: #2a3942;
    }

    /* CHAT AREA */
    .chat-area {
      width: 70%;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      background: #202c33;
      padding: 10px;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .msg {
      max-width: 70%;
      padding: 8px;
      border-radius: 10px;
      font-size: 14px;
    }

    .me {
      background: #005c4b;
      align-self: flex-end;
    }

    .other {
      background: #202c33;
      align-self: flex-start;
    }

    .input {
      display: flex;
      padding: 10px;
      background: #202c33;
      gap: 5px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2a3942;
      color: white;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #00a884;
      color: white;
      cursor: pointer;
    }

    .add-contact {
      padding: 10px;
      background: #111b21;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="add-contact">
    <input id="newContact" placeholder="Agregar correo">
    <button onclick="addContact()">Agregar</button>
  </div>

  <div id="chatList"></div>

</div>

<!-- CHAT -->
<div class="chat-area">

  <div class="topbar" id="chatTitle">Selecciona un chat</div>

  <div id="messages" class="messages"></div>

  <div class="input">
    <input id="msg" placeholder="Mensaje">
    <button onclick="sendMsg()">Enviar</button>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  where,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH",
  projectId: "TU_PROJECT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentChat = null;

// ================= LOGIN AUTO =================
onAuthStateChanged(auth, (user) => {
  if (!user) {
    signInWithPopup(auth, provider);
  } else {
    loadChats();
  }
});

// ================= CONTACTOS =================
window.addContact = async () => {
  const email = document.getElementById("newContact").value;
  const user = auth.currentUser;

  if (!email || !user) return;

  await addDoc(collection(db, "chats"), {
    users: [user.email, email]
  });

  document.getElementById("newContact").value = "";
};

// ================= LISTA CHATS =================
function loadChats() {
  const user = auth.currentUser;

  onSnapshot(collection(db, "chats"), (snap) => {
    const list = document.getElementById("chatList");
    list.innerHTML = "";

    snap.forEach(d => {
      const chat = d.data();

      if (!chat.users.includes(user.email)) return;

      const other = chat.users.find(u => u !== user.email);

      const div = document.createElement("div");
      div.className = "chat-item";
      div.textContent = other;

      div.onclick = () => openChat(d.id, other);

      list.appendChild(div);
    });
  });
}

// ================= ABRIR CHAT =================
function openChat(chatId, name) {
  currentChat = chatId;
  document.getElementById("chatTitle").textContent = name;
  listenMessages(chatId);
}

// ================= MENSAJES =================
function listenMessages(chatId) {
  const q = query(
    collection(db, "messages"),
    where("chatId", "==", chatId),
    orderBy("timestamp", "asc")
  );

  onSnapshot(q, (snap) => {
    const div = document.getElementById("messages");
    div.innerHTML = "";

    snap.forEach(d => {
      const m = d.data();

      const msg = document.createElement("div");
      msg.className = "msg " + (m.sender === auth.currentUser.email ? "me" : "other");
      msg.textContent = m.text;

      div.appendChild(msg);
    });

    div.scrollTop = div.scrollHeight;
  });
}

// ================= ENVIAR =================
window.sendMsg = async () => {
  const text = document.getElementById("msg").value;
  const user = auth.currentUser;

  if (!text || !currentChat) return;

  await addDoc(collection(db, "messages"), {
    chatId: currentChat,
    text,
    sender: user.email,
    timestamp: Date.now()
  });

  document.getElementById("msg").value = "";
};

</script>

</body>
</html>
