<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #202123;
      color: white;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* LOGIN */
    .login-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #40414F;
      color: white;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #19c37d;
      color: white;
    }

    .logout {
      background: red;
      padding: 8px;
      border: none;
      border-radius: 8px;
      margin: 5px;
      cursor: pointer;
    }

    /* CHAT */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #2b2c33;
    }

    select {
      background: #40414F;
      color: white;
      border: none;
      padding: 5px;
      border-radius: 6px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      padding: 8px;
      border-radius: 10px;
      max-width: 70%;
      font-size: 14px;
      position: relative;
    }

    .me {
      background: #19c37d;
      align-self: flex-end;
    }

    .other {
      background: #2E2F3A;
      align-self: flex-start;
    }

    .meta {
      font-size: 10px;
      opacity: 0.7;
    }

    .actions {
      font-size: 10px;
      margin-top: 4px;
      display: flex;
      gap: 5px;
      cursor: pointer;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #2b2c33;
      gap: 5px;
    }

    .input-area input {
      flex: 1;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button class="btn" onclick="loginGoogle()">Google</button>

  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">

  <button class="btn" onclick="loginEmail()">Entrar</button>
</div>

<!-- CHAT -->
<div id="chatUI" style="display:none;" class="container">

  <div class="topbar">
    <button class="logout" onclick="logout()">Salir</button>

    <select id="room" onchange="cambiarSala()">
      <option value="general">General</option>
      <option value="gaming">Gaming</option>
      <option value="random">Random</option>
    </select>
  </div>

  <div id="messages" class="messages"></div>

  <div class="input-area">
    <input id="mensaje" placeholder="Mensaje">
    <button class="btn" onclick="enviar()">Enviar</button>
  </div>
</div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  updateDoc,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged,
  signOut,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "TU_KEY",
  authDomain: "TU_DOMAIN",
  projectId: "TU_PROJECT"
});

const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const msgInput = document.getElementById("mensaje");
const loginBox = document.getElementById("login");
const chatUI = document.getElementById("chatUI");
const messagesDiv = document.getElementById("messages");

let room = "general";
let editId = null;

// LOGIN
window.loginGoogle = () => signInWithPopup(auth, provider);

window.loginEmail = async () => {
  const email = email.value;
  const pass = password.value;
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch {
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

window.logout = () => signOut(auth);

// ROOMS
window.cambiarSala = () => {
  room = document.getElementById("room").value;
  listenMessages();
};

// AUTH UI
onAuthStateChanged(auth, (user) => {
  loginBox.style.display = user ? "none" : "flex";
  chatUI.style.display = user ? "flex" : "none";
  listenMessages();
});

// SEND / EDIT
window.enviar = async () => {
  const user = auth.currentUser;
  if (!user || !msgInput.value) return;

  if (editId) {
    await updateDoc(doc(db, "mensajes", editId), {
      mensaje: msgInput.value
    });
    editId = null;
    msgInput.value = "";
    return;
  }

  await addDoc(collection(db, "mensajes"), {
    mensaje: msgInput.value,
    usuario: user.email,
    uid: user.uid,
    room,
    fecha: Date.now()
  });

  msgInput.value = "";
};

// DELETE + EDIT
window.borrar = async (id) => {
  await deleteDoc(doc(db, "mensajes", id));
};

window.editar = (id, texto) => {
  msgInput.value = texto;
  editId = id;
};

// LISTEN
function listenMessages() {
  const q = query(
    collection(db, "mensajes"),
    orderBy("fecha", "asc")
  );

  onSnapshot(q, (snap) => {
    messagesDiv.innerHTML = "";

    snap.forEach((d) => {
      const m = d.data();

      if (m.room !== room) return;

      const isMe = auth.currentUser?.uid === m.uid;

      const div = document.createElement("div");
      div.className = "msg " + (isMe ? "me" : "other");

      div.innerHTML = `
        <div><b>${m.usuario}</b></div>
        <div>${m.mensaje}</div>

        <div class="meta">${new Date(m.fecha).toLocaleTimeString()}</div>

        ${isMe ? `
        <div class="actions">
          <span onclick="editar('${d.id}','${m.mensaje}')">✏️ Editar</span>
          <span onclick="borrar('${d.id}')">🗑️ Borrar</span>
        </div>` : ""}
      `;

      messagesDiv.appendChild(div);
    });

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

// ENTER
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") enviar();
});
</script>

</body>
</html>
