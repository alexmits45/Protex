<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .contacts {
      width: 35%;
      background: #1f2c34;
      overflow-y: auto;
    }

    .add-contact {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .contact {
      padding: 12px;
      color: white;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b141a;
    }

    .header {
      background: #202c33;
      color: white;
      padding: 10px;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
      max-width: 70%;
    }

    .yo { background: #005c4b; margin-left: auto; color:white; }
    .otro { background: #202c33; color:white; }

    .input-area {
      display: flex;
      padding: 10px;
      background: #202c33;
      gap:5px;
    }

    input, button {
      border: none;
      border-radius: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      background: #2a3942;
      color: white;
    }

    button {
      padding: 10px;
      background: #00a884;
      color: white;
      cursor: pointer;
    }

    .login-box {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    img {
      border-radius: 10px;
      margin-top:5px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button onclick="loginGoogle()">Google</button>
  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="loginEmail()">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none;">

  <div class="contacts">
    <div class="add-contact">
      <input id="correoContacto" placeholder="Correo">
      <button onclick="agregarContacto()">➕</button>
    </div>

    <div id="contactos"></div>
  </div>

  <div class="chat-container">
    <div class="header" id="chatNombre">Selecciona un contacto</div>

    <div id="chat" class="messages"></div>

    <div class="input-area">
      <input id="mensaje" placeholder="Mensaje">
      <input type="file" id="foto" accept="image/*">
      <button onclick="enviar()">➤</button>
      <button onclick="enviarFoto()">📷</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, getDocs, doc, setDoc, updateDoc, query } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { 
  getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged,
  createUserWithEmailAndPassword, signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getStorage, ref, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJxRJfJ2fWZPKaBeOVS7BFOWeDM_WH6MU",
  authDomain: "nexchat-382ba.firebaseapp.com",
  projectId: "nexchat-382ba",
  storageBucket: "nexchat-382ba.firebasestorage.app",
  messagingSenderId: "217334097339",
  appId: "1:217334097339:web:87f002c08a522c9abd509e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

const provider = new GoogleAuthProvider();

const mensajesRef = collection(db, "mensajes");
const usersRef = collection(db, "users");

let usuarioSeleccionado = null;
let ultimoMensaje = null;

Notification.requestPermission();

// LOGIN
window.loginGoogle = async () => await signInWithPopup(auth, provider);

window.loginEmail = async () => {
  try {
    await createUserWithEmailAndPassword(auth, email.value, password.value);
  } catch {
    await signInWithEmailAndPassword(auth, email.value, password.value);
  }
};

// ESTADO
onAuthStateChanged(auth, async (user) => {
  if (user) {
    login.style.display = "none";
    app.style.display = "flex";

    await setDoc(doc(db, "users", user.uid), {
      nombre: user.displayName || user.email,
      online: true
    });

    cargarContactos();
  } else {
    login.style.display = "block";
    app.style.display = "none";
  }
});

// OFFLINE
window.addEventListener("beforeunload", async () => {
  if (auth.currentUser) {
    await updateDoc(doc(db, "users", auth.currentUser.uid), {
      online: false
    });
  }
});

// AGREGAR CONTACTO
window.agregarContacto = async () => {
  const correo = correoContacto.value;
  const snapshot = await getDocs(usersRef);

  let encontrado = null;
  snapshot.forEach(docu => {
    if (docu.data().nombre === correo) {
      encontrado = { id: docu.id, ...docu.data() };
    }
  });

  if (!encontrado) return alert("No existe");

  await setDoc(doc(db, "contactos", auth.currentUser.uid, "lista", encontrado.id), {
    nombre: encontrado.nombre
  });

  cargarContactos();
};

// CONTACTOS
async function cargarContactos() {
  const ref = collection(db, "contactos", auth.currentUser.uid, "lista");
  const snapshot = await getDocs(ref);

  contactos.innerHTML = "";

  snapshot.forEach(docu => {
    const div = document.createElement("div");
    div.className = "contact";
    div.textContent = docu.data().nombre;

    div.onclick = () => {
      usuarioSeleccionado = docu.id;
      chatNombre.textContent = docu.data().nombre;
      chat.innerHTML = "";
    };

    contactos.appendChild(div);
  });
}

// ENVIAR TEXTO
window.enviar = async () => {
  if (!mensaje.value || !usuarioSeleccionado) return;

  await addDoc(mensajesRef, {
    de: auth.currentUser.uid,
    para: usuarioSeleccionado,
    mensaje: mensaje.value,
    fecha: Date.now()
  });

  mensaje.value = "";
};

// ENVIAR FOTO
window.enviarFoto = async () => {
  const file = foto.files[0];
  if (!file || !usuarioSeleccionado) return;

  const storageRef = ref(storage, "fotos/" + Date.now());
  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);

  await addDoc(mensajesRef, {
    de: auth.currentUser.uid,
    para: usuarioSeleccionado,
    imagen: url,
    fecha: Date.now()
  });

  foto.value = "";
};

// MENSAJES + NOTIFICACIONES
onSnapshot(query(mensajesRef), (snapshot) => {
  snapshot.docChanges().forEach(change => {
    if (change.type === "added") {
      const data = change.doc.data();
      const yo = auth.currentUser.uid;

      if (
        (data.de === yo && data.para === usuarioSeleccionado) ||
        (data.de === usuarioSeleccionado && data.para === yo)
      ) {
        const div = document.createElement("div");
        div.classList.add("msg");
        div.classList.add(data.de === yo ? "yo" : "otro");

        if (data.imagen) {
          const img = document.createElement("img");
          img.src = data.imagen;
          img.style.maxWidth = "150px";
          div.appendChild(img);
        } else {
          div.textContent = data.mensaje;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      if (data.de !== yo && Notification.permission === "granted") {
        if (ultimoMensaje !== data.mensaje) {
          new Notification("Nuevo mensaje 💬", {
            body: data.mensaje || "📷 Imagen"
          });
          ultimoMensaje = data.mensaje;
        }
      }
    }
  });
});
</script>

</body>
</html>
