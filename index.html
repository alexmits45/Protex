<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #202123;
      margin: 0;
      font-family: Arial;
      display: none; /* 👈 evita flash */
    }

    .container {
      width: 100%;
      height: 100vh;
      background-color: #343541;
      display: flex;
      flex-direction: column;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      background-color: #2E2F3A;
      color: white;
      padding: 8px;
      margin: 5px 0;
      border-radius: 8px;
      font-size: 14px;
      max-width: 80%;
    }

    .input-place {
      display: flex;
      padding: 10px;
      background: #343541;
      position: sticky;
      bottom: 0;
    }

    .send-input {
      flex: 1;
      border: none;
      background: #40414F;
      color: white;
      padding: 10px;
      border-radius: 8px;
      outline: none;
    }

    .send {
      background-color: #19c37d;
      border: none;
      color: white;
      border-radius: 8px;
      padding: 10px;
      margin-left: 5px;
      cursor: pointer;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }

    .login-btn {
      padding: 12px;
      border: none;
      background: #19c37d;
      color: white;
      cursor: pointer;
      border-radius: 8px;
    }

    .logout {
      background: red;
      color: white;
      border: none;
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      margin: 5px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button class="login-btn" onclick="loginGoogle()">Google</button>

  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">

  <button class="login-btn" onclick="loginEmail()">Entrar / Registrarse</button>
</div>

<!-- CHAT -->
<div id="chatUI" style="display:none;">
  <div class="container">

    <button class="logout" onclick="logout()">Cerrar sesión</button>

    <div id="chat" class="messages-area"></div>

    <div class="input-place">
      <input id="mensaje" placeholder="Mensaje" class="send-input">
      <button class="send" onclick="enviar()">Enviar</button>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { 
  getAuth, 
  signInWithPopup, 
  GoogleAuthProvider, 
  onAuthStateChanged,
  signOut,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJxRJfJ2fWZPKaBeOVS7BFOWeDM_WH6MU",
  authDomain: "nexchat-382ba.firebaseapp.com",
  projectId: "nexchat-382ba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();
const mensajesRef = collection(db, "mensajes");

// LOGIN GOOGLE
window.loginGoogle = async () => {
  await signInWithPopup(auth, provider);
};

// LOGIN EMAIL
window.loginEmail = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch {
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

// LOGOUT
window.logout = () => signOut(auth);

// ESTADO (SIN FLASH)
onAuthStateChanged(auth, (user) => {
  console.log("Usuario:", user);

  document.body.style.display = "block";

  login.style.display = user ? "none" : "block";
  chatUI.style.display = user ? "block" : "none";
});

// ENVIAR
window.enviar = async () => {
  const mensaje = mensajeInput.value;
  const user = auth.currentUser;

  if (!mensaje || !user) return;

  await addDoc(mensajesRef, {
    usuario: user.displayName || user.email,
    mensaje,
    fecha: Date.now()
  });

  mensajeInput.value = "";
};

// TIEMPO REAL
onSnapshot(mensajesRef, (snapshot) => {
  console.log("Mensajes:", snapshot.size);

  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  if (snapshot.empty) {
    chat.innerHTML = "<p style='color:white'>No hay mensajes aún 👀</p>";
    return;
  }

  snapshot.forEach((doc) => {
    const data = doc.data();

    const div = document.createElement("div");
    div.classList.add("msg");
    div.textContent = data.usuario + ": " + data.mensaje;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

// ENTER
document.addEventListener("keypress", (e) => {
  if (e.key === "Enter") enviar();
});
</script>

</body>
</html>
