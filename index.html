<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #202123;
      color: white;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #40414F;
      color: white;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #19c37d;
      color: white;
      cursor: pointer;
    }

    .container {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .topbar {
      background: #2b2c33;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #contacts {
      background: #2b2c33;
      padding: 10px;
      font-size: 12px;
    }

    .contact {
      padding: 4px;
      border-bottom: 1px solid #444;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      background: #2E2F3A;
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      max-width: 80%;
    }

    .me {
      background: #19c37d;
      align-self: flex-end;
    }

    .actions {
      font-size: 10px;
      cursor: pointer;
      margin-top: 5px;
    }

    img {
      max-width: 200px;
      border-radius: 10px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button onclick="loginGoogle()">Google</button>

  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">

  <button onclick="loginEmail()">Entrar</button>
</div>

<!-- CHAT -->
<div id="chatUI" class="container">

  <div class="topbar">
    <span>NexChat Pro</span>
    <button onclick="logout()">Salir</button>
  </div>

  <div id="contacts"></div>

  <div id="messages"></div>

  <div style="display:flex; gap:5px; padding:10px;">
    <input id="mensaje" placeholder="Mensaje" style="flex:1;">
    <input type="file" id="file">
    <button onclick="enviar()">Enviar</button>
    <button onclick="enviarArchivo()">📎</button>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  deleteDoc,
  doc,
  updateDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// 🔥 TU CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCJxRJfJ2fWZPKaBeOVS7BFOWeDM_WH6MU",
  authDomain: "nexchat-382ba.firebaseapp.com",
  databaseURL: "https://nexchat-382ba-default-rtdb.firebaseio.com",
  projectId: "nexchat-382ba",
  storageBucket: "nexchat-382ba.firebasestorage.app",
  messagingSenderId: "217334097339",
  appId: "1:217334097339:web:87f002c08a522c9abd509e",
  measurementId: "G-Y2WLJPE5RV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let editId = null;

// 🔔 NOTIFICACIONES
if ("Notification" in window) {
  Notification.requestPermission();
}

// LOGIN
window.loginGoogle = () => signInWithPopup(auth, provider);

window.loginEmail = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch {
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

window.logout = () => signOut(auth);

// USUARIO
onAuthStateChanged(auth, async (user) => {
  document.getElementById("login").style.display = user ? "none" : "flex";
  document.getElementById("chatUI").style.display = user ? "flex" : "none";

  if (!user) return;

  // guardar contacto
  await setDoc(doc(db, "users", user.uid), {
    uid: user.uid,
    email: user.email,
    lastSeen: Date.now()
  });

  loadContacts();
  listenMessages();
});

// CONTACTOS
function loadContacts() {
  onSnapshot(collection(db, "users"), (snap) => {
    const div = document.getElementById("contacts");
    div.innerHTML = "<b>Contactos</b>";

    snap.forEach(u => {
      div.innerHTML += `<div class="contact">🟢 ${u.data().email}</div>`;
    });
  });
}

// ENVIAR MENSAJE
window.enviar = async () => {
  const user = auth.currentUser;
  const msg = document.getElementById("mensaje").value;
  if (!user || !msg) return;

  await addDoc(collection(db, "mensajes"), {
    mensaje: msg,
    usuario: user.email,
    uid: user.uid,
    fecha: Date.now()
  });

  document.getElementById("mensaje").value = "";
};

// SUBIR ARCHIVO
window.enviarArchivo = async () => {
  const file = document.getElementById("file").files[0];
  const user = auth.currentUser;

  if (!file || !user) return;

  const fileRef = ref(storage, "chat/" + Date.now() + file.name);
  await uploadBytes(fileRef, file);
  const url = await getDownloadURL(fileRef);

  await addDoc(collection(db, "mensajes"), {
    usuario: user.email,
    uid: user.uid,
    image: url,
    fecha: Date.now()
  });
};

// MENSAJES
function listenMessages() {
  const q = query(collection(db, "mensajes"), orderBy("fecha", "asc"));

  onSnapshot(q, (snap) => {
    const div = document.getElementById("messages");
    div.innerHTML = "";

    snap.forEach(d => {
      const m = d.data();
      const isMe = auth.currentUser?.uid === m.uid;

      const msg = document.createElement("div");
      msg.className = "msg " + (isMe ? "me" : "");

      msg.innerHTML = `
        <b>${m.usuario}</b><br>
        ${m.mensaje || ""}
        ${m.image ? `<br><img src="${m.image}">` : ""}
      `;

      div.appendChild(msg);

      // 🔔 NOTIFICACIÓN
      if (document.hidden && m.uid !== auth.currentUser?.uid) {
        new Notification("Nuevo mensaje", {
          body: m.usuario
        });
      }
    });

    div.scrollTop = div.scrollHeight;
  });
}

// ENTER
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") enviar();
});

</script>

</body>
</html>
