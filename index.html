<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #202123;
      color: white;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #40414F;
      color: white;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #19c37d;
      color: white;
      cursor: pointer;
    }

    .container {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .topbar {
      background: #2b2c33;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      background: #2E2F3A;
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      max-width: 80%;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button onclick="loginGoogle()">Iniciar con Google</button>

  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">

  <button onclick="loginEmail()">Entrar / Registrarse</button>
</div>

<!-- CHAT -->
<div id="chatUI" class="container">

  <div class="topbar">
    <span>NexChat Pro</span>
    <button onclick="logout()">Salir</button>
  </div>

  <div id="messages"></div>

  <div style="display:flex; padding:10px; gap:5px;">
    <input id="mensaje" placeholder="Escribe un mensaje..." style="flex:1;">
    <button onclick="enviar()">Enviar</button>
  </div>

</div>

<script type="module">

// ================= FIREBASE IMPORTS (CDN CORRECTO) =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getStorage
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// ================= TU CONFIG REAL =================
const firebaseConfig = {
  apiKey: "AIzaSyCJxRJfJ2fWZPKaBeOVS7BFOWeDM_WH6MU",
  authDomain: "nexchat-382ba.firebaseapp.com",
  databaseURL: "https://nexchat-382ba-default-rtdb.firebaseio.com",
  projectId: "nexchat-382ba",
  storageBucket: "nexchat-382ba.firebasestorage.app",
  messagingSenderId: "217334097339",
  appId: "1:217334097339:web:87f002c08a522c9abd509e",
  measurementId: "G-Y2WLJPE5RV"
};

// ================= INIT FIREBASE =================
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const storage = getStorage(app);

const msgInput = document.getElementById("mensaje");

// ================= LOGIN GOOGLE =================
window.loginGoogle = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    console.log(e);
    alert("Error login Google");
  }
};

// ================= LOGIN EMAIL =================
window.loginEmail = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) return alert("Falta correo o contraseña");

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch {
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      console.log(e);
      alert("Error login");
    }
  }
};

// ================= LOGOUT =================
window.logout = () => signOut(auth);

// ================= ESTADO LOGIN =================
onAuthStateChanged(auth, (user) => {
  document.getElementById("login").style.display = user ? "none" : "flex";
  document.getElementById("chatUI").style.display = user ? "flex" : "none";

  if (user) listenMessages();
});

// ================= ENVIAR MENSAJE =================
window.enviar = async () => {
  const user = auth.currentUser;
  if (!user || !msgInput.value) return;

  await addDoc(collection(db, "mensajes"), {
    mensaje: msgInput.value,
    usuario: user.email,
    uid: user.uid,
    fecha: Date.now()
  });

  msgInput.value = "";
};

// ================= MENSAJES EN TIEMPO REAL =================
function listenMessages() {
  const q = query(collection(db, "mensajes"), orderBy("fecha", "asc"));

  onSnapshot(q, (snap) => {
    const div = document.getElementById("messages");
    div.innerHTML = "";

    snap.forEach(doc => {
      const m = doc.data();

      const msg = document.createElement("div");
      msg.className = "msg";
      msg.textContent = `${m.usuario}: ${m.mensaje}`;

      div.appendChild(msg);
    });

    div.scrollTop = div.scrollHeight;
  });
}

// ================= ENTER =================
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") enviar();
});

</script>

</body>
</html>
