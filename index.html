<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111b21;
      color: white;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 30%;
      background: #202c33;
      display: flex;
      flex-direction: column;
    }

    .top {
      padding: 10px;
      display: flex;
      gap: 5px;
      background: #111b21;
    }

    .chat-item {
      padding: 12px;
      border-bottom: 1px solid #2a3942;
      cursor: pointer;
    }

    .chat-item:hover {
      background: #2a3942;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: #202c33;
      padding: 10px;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg {
      max-width: 70%;
      padding: 8px;
      border-radius: 10px;
      font-size: 14px;
    }

    .me {
      background: #005c4b;
      align-self: flex-end;
    }

    .other {
      background: #202c33;
      align-self: flex-start;
    }

    .input {
      display: flex;
      padding: 10px;
      background: #202c33;
      gap: 5px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2a3942;
      color: white;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #00a884;
      color: white;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0008;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #2b2c33;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="top">
    <button onclick="openModal()">➕</button>
  </div>

  <div id="chatList"></div>
</div>

<!-- CHAT -->
<div class="chat-area">

  <div class="topbar" id="chatTitle">Selecciona un chat</div>

  <div id="messages" class="messages"></div>

  <div class="input">
    <input id="msg" placeholder="Mensaje">
    <button onclick="sendMsg()">Enviar</button>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h3>Agregar contacto</h3>

    <input id="contactEmail" placeholder="Correo">

    <button onclick="addContact()">Agregar</button>
    <button onclick="closeModal()">Cerrar</button>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  where,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJxRJfJ2fWZPKaBeOVS7BFOWeDM_WH6MU",
  authDomain: "nexchat-382ba.firebaseapp.com",
  projectId: "nexchat-382ba"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentChat = null;

// 🔐 LOGIN AUTO
onAuthStateChanged(auth, (user) => {
  if (!user) {
    signInWithPopup(auth, provider);
  } else {
    loadChats();
  }
});

// ================= MODAL =================
window.openModal = () => {
  document.getElementById("modal").style.display = "flex";
};

window.closeModal = () => {
  document.getElementById("modal").style.display = "none";
};

// ================= AGREGAR CONTACTO (FIX REAL) =================
window.addContact = async () => {
  const email = document.getElementById("contactEmail").value.trim().toLowerCase();
  const user = auth.currentUser;

  if (!email) return alert("Escribe un correo");

  if (email === user.email) {
    return alert("No puedes agregarte a ti mismo");
  }

  // 🔥 VERIFICAR DUPLICADO
  const snap = await new Promise(resolve => {
    onSnapshot(collection(db, "chats"), (s) => resolve(s), { onlyOnce: true });
  });

  let exists = false;

  snap.forEach(d => {
    const c = d.data();
    if (c.users.includes(user.email) && c.users.includes(email)) {
      exists = true;
    }
  });

  if (exists) {
    return alert("Ya tienes este contacto");
  }

  await addDoc(collection(db, "chats"), {
    users: [user.email, email]
  });

  document.getElementById("contactEmail").value = "";
  closeModal();
};

// ================= CHATS =================
function loadChats() {
  const user = auth.currentUser;

  onSnapshot(collection(db, "chats"), (snap) => {
    const list = document.getElementById("chatList");
    list.innerHTML = "";

    snap.forEach(d => {
      const c = d.data();

      if (!c.users.includes(user.email)) return;

      const other = c.users.find(u => u !== user.email);

      const div = document.createElement("div");
      div.className = "chat-item";
      div.textContent = other;

      div.onclick = () => openChat(d.id, other);

      list.appendChild(div);
    });
  });
}

// ================= ABRIR CHAT =================
function openChat(chatId, name) {
  currentChat = chatId;
  document.getElementById("chatTitle").textContent = name;
  listenMessages(chatId);
}

// ================= MENSAJES =================
function listenMessages(chatId) {
  const q = query(
    collection(db, "messages"),
    where("chatId", "==", chatId),
    orderBy("timestamp", "asc")
  );

  onSnapshot(q, (snap) => {
    const div = document.getElementById("messages");
    div.innerHTML = "";

    snap.forEach(d => {
      const m = d.data();

      const msg = document.createElement("div");
      msg.className = "msg " + (m.sender === auth.currentUser.email ? "me" : "other");

      msg.textContent = m.text;

      div.appendChild(msg);
    });

    div.scrollTop = div.scrollHeight;
  });
}

// ================= ENVIAR =================
window.sendMsg = async () => {
  const text = document.getElementById("msg").value;
  const user = auth.currentUser;

  if (!text || !currentChat) return;

  await addDoc(collection(db, "messages"), {
    chatId: currentChat,
    text,
    sender: user.email,
    timestamp: Date.now()
  });

  document.getElementById("msg").value = "";
};

</script>

</body>
</html>
