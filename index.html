<!DOCTYPE html>
<html>
<head>
  <title>NexChat Pro</title>

  <style>
    body {
      background: #202123;
      display: flex;
      justify-content: center;
      margin-top: 50px;
      font-family: Arial;
    }

    .container {
      width: 320px;
      height: 450px;
      background-color: #343541;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
    }

    .msg {
      background-color: #2E2F3A;
      color: white;
      padding: 6px;
      margin: 5px 0;
      border-radius: 5px;
      font-size: 13px;
    }

    .input-place {
      display: flex;
      gap: 5px;
    }

    .send-input {
      flex: 1;
      border: none;
      background: #40414F;
      color: white;
      padding: 6px;
      border-radius: 5px;
      outline: none;
    }

    .send {
      background-color: #19c37d;
      border: none;
      color: white;
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 300px;
    }

    .login-btn {
      padding: 10px;
      border: none;
      background: #19c37d;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    .logout {
      margin-bottom: 5px;
      background: red;
      color: white;
      border: none;
      padding: 5px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-box">
  <button class="login-btn" onclick="loginGoogle()">Google</button>

  <input id="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">

  <button class="login-btn" onclick="loginEmail()">Entrar / Registrarse</button>
</div>

<!-- CHAT -->
<div id="chatUI" style="display:none;">
  <div class="container">

    <button class="logout" onclick="logout()">Cerrar sesión</button>

    <div id="chat" class="messages-area"></div>

    <div class="input-place">
      <input id="mensaje" placeholder="Mensaje" class="send-input">
      <button class="send" onclick="enviar()">Enviar</button>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { 
  getAuth, 
  signInWithPopup, 
  GoogleAuthProvider, 
  onAuthStateChanged,
  signOut,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 TU CONFIG REAL
const firebaseConfig = {
  apiKey: "AIzaSyCJxRJfJ2fWZPKaBeOVS7BFOWeDM_WH6MU",
  authDomain: "nexchat-382ba.firebaseapp.com",
  projectId: "nexchat-382ba",
  storageBucket: "nexchat-382ba.firebasestorage.app",
  messagingSenderId: "217334097339",
  appId: "1:217334097339:web:87f002c08a522c9abd509e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();
const mensajesRef = collection(db, "mensajes");

// LOGIN GOOGLE
window.loginGoogle = async function () {
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    alert(error.message);
  }
};

// LOGIN EMAIL
window.loginEmail = async function () {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) {
    alert("Completa los campos");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    alert("Cuenta creada 🔥");
  } catch (e) {
    if (e.code === "auth/email-already-in-use") {
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("Contraseña incorrecta");
      }
    } else {
      alert(e.message);
    }
  }
};

// LOGOUT
window.logout = function () {
  signOut(auth);
};

// DETECTAR USUARIO
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("login").style.display = "none";
    document.getElementById("chatUI").style.display = "block";
  } else {
    document.getElementById("login").style.display = "block";
    document.getElementById("chatUI").style.display = "none";
  }
});

// ENVIAR MENSAJE
window.enviar = async function () {
  const mensaje = document.getElementById("mensaje").value;
  const user = auth.currentUser;

  if (!mensaje || !user) return;

  await addDoc(mensajesRef, {
    usuario: user.displayName || user.email,
    uid: user.uid,
    mensaje,
    fecha: Date.now()
  });

  document.getElementById("mensaje").value = "";
};

// CHAT EN TIEMPO REAL
const q = query(mensajesRef, orderBy("fecha"));

onSnapshot(q, (snapshot) => {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  snapshot.forEach((doc) => {
    const data = doc.data();

    const div = document.createElement("div");
    div.classList.add("msg");
    div.textContent = data.usuario + ": " + data.mensaje;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

// ENTER PARA ENVIAR
document.addEventListener("keypress", (e) => {
  if (e.key === "Enter") enviar();
});
</script>

</body>
</html>
